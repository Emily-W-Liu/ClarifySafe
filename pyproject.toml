[project]
name = "clarifysafe"
version = "0.4.0"
description = "ClarifySafe agent harness: typed state, human intervention and guarded tools"
requires-python = ">=3.11,<3.14"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "pydantic>=2.10,<3", "openai>=2,<3", "jsonschema>=4.26,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "filelock>=3.16,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
clarifysafe = "clarifysafe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
